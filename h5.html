<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات | Kayan Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            direction: rtl;
            text-align: center;
            background-color: #f4f4f4;
            padding-top: 60px;
        }
        /* رأس الصفحة */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }
        .header img {
            width: 30px;
            height: 20px;
            border-radius: 50%;
        }
        .header h1 {
            flex-grow: 1;
            font-size: 18px;
        }
        .menu-button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        /* القائمة الجانبية */
        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background: #444;
            padding-top: 60px;
            transition: 0.3s;
        }
        .sidebar a {
            display: block;
            padding: 10px;
            color: white;
            text-decoration: none;
            border-bottom: 1px solid #666;
        }
        .sidebar a:hover {
            background: #666;
        }
        .show-sidebar {
            right: 0;
        }
        /* إعدادات الصفحة */
        .settings-container {
            margin-top: 100px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .settings-container h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }
        .settings-container label {
            display: block;
            margin: 10px 0;
            font-size: 16px;
        }
        .settings-container input[type="text"], 
        .settings-container input[type="email"], 
        .settings-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .settings-container button {
            padding: 12px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .settings-container button:hover {
            background: #0056b3;
        }
        /* حقوق الملكية */
        .copyright {
            background: #111;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة -->
    <div class="header">
        <img src="profile.jpg" alt="الصورة الشخصية">
        <h1>كيان شات | Kayan Chat</h1>
        <button class="menu-button" onclick="toggleMenu()">☰</button>
    </div>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <a href="h1.html">الرئيسية</a>
        <a href="h2.html">الدردشة</a>
        <a href="h3.html">دردشة فردية</a>
        <a href="h4.html">دردشة جماعية</a>
        <a href="h5.html">صفحة الإعدادات</a>
        <a href="h6.html">صفحة تسجيل الدخول</a>
        <a href="h7.html">صفحة تسجيل الاشتراك</a>
        <a href="h8.html">صفحة من نحن</a>
        <a href="h9.html">صفحة إنشاء مجموعة جديدة</a>
        <a href="h10.html">صفحة ابحث عن محادثات عشوائية</a>
    </div>

    <!-- إعدادات الصفحة -->
    <div class="settings-container">
        <h2>إعدادات الحساب</h2>
        <form>
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required>

            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>

            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>

            <label for="confirm-password">تأكيد كلمة المرور</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="أعد إدخال كلمة المرور" required>

            <button type="submit">حفظ التغييرات</button>
        </form>
    </div>

    <!-- حقوق الملكية -->
    <div class="copyright">
        &copy; 2025 جميع الحقوق محفوظة | كيان شات
    </div>

    <script>
        function toggleMenu() {
            var sidebar = document.getElementById("sidebar");
            sidebar.classList.toggle("show-sidebar");
        }
        document.addEventListener("click", function (event) {
            var sidebar = document.getElementById("sidebar");
            var menuButton = document.querySelector(".menu-button");
            if (!sidebar.contains(event.target) && !menuButton.contains(event.target)) {
                sidebar.classList.remove("show-sidebar");
            }
        });
    </script>

</body>
</html>
